name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  ARDUINO_CLI_VERSION: 1.0.4

jobs:
  # =============================================================================
  # Backend (FastAPI) - Python Tests & Lint
  # =============================================================================
  backend-test:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (ruff)
        run: |
          pip install ruff
          ruff check app/

      - name: Run type checking (mypy)
        run: |
          pip install mypy
          mypy app/

      - name: Run tests (pytest)
        run: |
          pytest -v --tb=short

  # =============================================================================
  # Firmware - Arduino CLI Compilation
  # =============================================================================
  firmware-compile:
    name: Firmware Compilation (arduino-cli)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        firmware:
          - gateway-esp32
          - mega-access
          - rover-uno
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s ${ARDUINO_CLI_VERSION}
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          $HOME/bin/arduino-cli version

      - name: Setup arduino-cli config
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install ESP32 core (for gateway-esp32)
        if: matrix.firmware == 'gateway-esp32'
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli core install esp32:esp32
          arduino-cli lib install "PubSubClient" "ArduinoJson@6.21.3" "RF24"

      - name: Install AVR core (for mega-access, rover-uno)
        if: matrix.firmware != 'gateway-esp32'
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli core install arduino:avr
          arduino-cli lib install "Keypad" "Servo" "RF24" "NewPing" "ArduinoJson@6.21.3" "PubSubClient"

      - name: Compile firmware
        run: |
          export PATH="$HOME/bin:$PATH"
          if [ "${{ matrix.firmware }}" = "gateway-esp32" ]; then FQBN="esp32:esp32:esp32"; elif [ "${{ matrix.firmware }}" = "rover-uno" ]; then FQBN="arduino:avr:uno"; else FQBN="arduino:avr:mega"; fi; echo "Compiling ${{ matrix.firmware }} with $FQBN"; arduino-cli compile --fqbn $FQBN ./firmware/${{ matrix.firmware }}

  # =============================================================================
  # Docker Build Test
  # =============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, firmware-compile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker-compose build --no-cache

      - name: Test Docker Compose up (background)
        run: |
          docker-compose up -d
          sleep 10
          docker-compose ps

      - name: Test FastAPI health endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1

      - name: Cleanup
        run: |
          docker-compose down -v

  # =============================================================================
  # Stats - Python Tests
  # =============================================================================
  stats-test:
    name: Stats Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./stats
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Asegura pytest y cov aunque requirements.txt no los traiga
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          if [ -f pytest.ini ] || [ -f pyproject.toml ] || ls test_*.py 1>/dev/null 2>&1; then
            pytest -v --tb=short
          else
            echo "No tests found in stats/, skipping"
          fi

  # =============================================================================
  # Android Build (optional - requires more setup)
  # =============================================================================
  android-build:
    name: Android Build Check
    runs-on: ubuntu-latest
    if: false  # Enable when app/ structure exists with gradle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd app
          ./gradlew assembleDebug

  # =============================================================================
  # Security Scan (Trivy)
  # =============================================================================
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'