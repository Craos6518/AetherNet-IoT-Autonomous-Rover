# =============================================================================
# Mosquitto Config — Broker MQTT LAN | 6º Semestre UTP | RNF-1.1, DEVOPS-02
# Autor: Est. Tecnología en Desarrollo Software + Ing. Sistemas (UTP)
# Experiencia: 1 año PostgreSQL (docker-compose), 2 años JS/React (MQTT.js),
#              2 años Python (paho-mqtt), 2 años electrónica (nRF24L01 vs MQTT)
# Analogía React: este archivo es `mosquitto.conf` como `vite.config.ts` — configura
# el broker MQTT (como configurar WebSocket server en Node con ws).
# Analogía C/Arduino: MQTT es el "WiFi" del backend — como nRF24L01 pero por TCP/IP
# (nRF es RF 2.4GHz SPI, MQTT es TCP 1883/WSS 9001). Mosquitto es el router MQTT.
# Analogía PostgreSQL: Mosquitto es el "Postgres" de mensajes — persiste y enruta
# (como Postgres persiste rows, Mosquitto persiste mensajes y topics).
# FOSS: Mosquitto (EPL/EDL) + paho-mqtt — RNF-3.1, sin AWS IoT.
# Configura: listeners 1883/9001, persistencia, logs, limits — ver acl.conf para ACL.
# =============================================================================
# Mosquitto configuration for AetherNet IoT — LAN-only broker con ACL básico (ver acl.conf)
# Usado por docker-compose.yml mosquitto service (volume ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf)

# --------------------------------------------------------------------------
# Listeners — puertos donde Mosquitto escucha (como app.listen(1883) en Node)
# --------------------------------------------------------------------------
listener 1883  # MQTT TCP — para Gateway ESP32 (PubSubClient), backend paho-mqtt, Node-RED mqtt in
protocol mqtt  # protocolo MQTT nativo — binario, eficiente (como nRF24L01 pero por TCP)
allow_anonymous true  # LAN cerrada Sprint 1 — sin auth (RNF-3.1 FOSS, sin cloud, ACL permite aethernet/#)
# En prod: allow_anonymous false + mosquitto_passwd file (ver acl.conf:3)

listener 9001  # WebSockets — para App Android WebSocket/MQTT.js (MQTT over WS, como WebSocket en React)
protocol websockets  # WS — mismo MQTT pero sobre WebSocket (para browsers/Apps que no hacen TCP raw)
# App Kotlin usa Paho MQTT con `tcp://host:1883` o `ws://host:9001` fallback (ver app/MqttManager)

# --------------------------------------------------------------------------
# Persistencia — guarda mensajes y sesiones en disco (como WAL en Postgres)
# --------------------------------------------------------------------------
persistence true  # persiste mensajes QoS 1/2 y retenciones — como Postgres persiste rows (ver init.sql)
persistence_location /mosquitto/data/  # carpeta en contenedor — volume mosquitto_data en docker-compose.yml
persistence_file mosquitto.db  # archivo DB Mosquitto — como mosquitto.db en backend/mosquitto/data/mosquitto.db

# --------------------------------------------------------------------------
# Logging — a archivo y stdout (como console.log en Node pero en Mosquitto)
# --------------------------------------------------------------------------
log_dest file /mosquitto/log/mosquitto.log  # archivo log — volume mosquitto_log, ver backend/mosquitto/log/mosquitto.log
log_dest stdout  # también a stdout — docker logs mosquitto lo muestra (como docker logs postgres)
log_type error  # errores — como console.error
log_type warning  # warnings — como console.warn
log_type notice  # notices — conexiones, subscribes (como log de acceso en Express)
log_type information  # info — como console.info
connection_messages true  # log cada connect/disconnect — útil para debug Gateway/App (como log de WS connect)
log_timestamp true  # timestamp en cada línea — como morgan en Express (ver log_timestamp_format)
log_timestamp_format %Y-%m-%dT%H:%M:%S  # formato ISO8601 — como toISOString() en JS

# --------------------------------------------------------------------------
# Límites — protección contra floods (como rate limit en Express, pero para MQTT)
# --------------------------------------------------------------------------
message_size_limit 102400  # 100KB max por mensaje — evita payload gigante (como bodyParser limit en Express)
max_inflight_messages 100  # 100 mensajes en vuelo por cliente — QoS flow control (como max concurrent requests)
max_queued_messages 1000  # 1000 en cola si cliente lento — evita OOM (como queue limit en Node)

# --------------------------------------------------------------------------
# ACL — control acceso por topic (como RBAC en API, pero para MQTT)
# --------------------------------------------------------------------------
# Topic ACL (optional - uncomment and configure for production) — ver acl.conf para reglas
# acl_file /mosquitto/config/acl.conf  # descomentar para activar ACL aethernet/# (ver acl.conf:14)
# En Sprint 1 LAN, allow_anonymous true + sin acl_file = todo permitido en aethernet/# (ver acl.conf:14)
