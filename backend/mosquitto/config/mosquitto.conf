# Mosquitto configuration for AetherNet IoT
# LAN-only broker with basic ACL

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Message size limits
message_size_limit 102400
max_inflight_messages 100
max_queued_messages 1000

# Topic ACL (optional - uncomment and configure for production)
# acl_file /mosquitto/config/acl.conf