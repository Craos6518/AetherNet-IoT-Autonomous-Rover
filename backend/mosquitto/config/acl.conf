# AetherNet Mosquitto ACL — DEVOPS-02 / Sprint 1
# LAN-only, allow_anonymous true por ahora (RNF-3.1 FOSS, sin cloud).
# Para producción, cambiar allow_anonymous false y crear usuarios con mosquitto_passwd.
# Referenciado en mosquitto.conf:33 — descomentar acl_file para activar.

# Topics principales (ver gateway.ino:39 y docs/architecture.md)
# - aethernet/rover/#         -> comando y telemetría Rover (RF-3.1)
# - aethernet/access/#        -> eventos acceso MEGA (HU-01, RF-2.2)
# - aethernet/seguridad/#     -> intrusión láser (HU-02, RF-2.3)
# - aethernet/relay/#         -> control relés
# - aethernet/system/#        -> heartbeat/status
# - aethernet/sensor/#        -> telemetría genérica (HU-03)

# Por defecto, permitir todo en LAN (Sprint 1)
topic readwrite aethernet/#
topic readwrite $SYS/#
