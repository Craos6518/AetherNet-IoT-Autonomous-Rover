# =============================================================================
# Mosquitto ACL — Control Acceso Topics | 6º Semestre UTP | DEVOPS-02, Sprint 1
# Autor: Andres Felipe Martinez Henao
# Experiencia: 1 año PostgreSQL (ACL = GRANT), 2 años JS/React (RBAC), 2 años Python
# Analogía PostgreSQL: este archivo es como `GRANT SELECT ON aethernet/* TO user` —
# define qué topics puede leer/escribir cada cliente (como GRANT en Postgres).
# Analogía React: es el `auth.middleware.js` pero para MQTT — filtra por topic.
# Analogía C/Arduino: como validar checksum en RF — solo deja pasar topics válidos.
# FOSS: Mosquitto ACL file (EPL) — RNF-3.1, sin cloud IAM.
# Referenciado en: mosquitto.conf:33 (descomentar acl_file para activar) y gateway.ino:39
# =============================================================================
# AetherNet Mosquitto ACL — DEVOPS-02 / Sprint 1 — LAN-only, allow_anonymous true por ahora.
# Para producción: cambiar allow_anonymous false en mosquitto.conf:6 y crear usuarios con
# `mosquitto_passwd -c /mosquitto/config/passwd aethernet` (como htpasswd en Node).
# Referenciado en mosquitto.conf:33 — descomentar `acl_file /mosquitto/config/acl.conf` para activar.

# --------------------------------------------------------------------------
# Topics principales (ver gateway.ino:68 topics y docs/architecture.md:60)
# --------------------------------------------------------------------------
# - aethernet/rover/#         -> comando y telemetría Rover (RF-3.1, Gateway ↔ Rover vía RF, Rover nRF24L01)
#   gateway subscribe aethernet/rover/command (App → Rover joystick), publish aethernet/rover/telemetry (Rover → App)
# - aethernet/access/#        -> eventos acceso MEGA (HU-01, RF-2.2, MEGA keypad → Gateway UART → HTTP/MQTT)
#   MEGA publish ACCESS: → Gateway → MQTT aethernet/access/event + HTTP POST /api/access-events
# - aethernet/seguridad/#     -> intrusión láser KY-008 (HU-02, RF-2.3) → Node-RED → Telegram (RF-4.1)
# - aethernet/system/#        -> heartbeat/status Gateway (aethernet/system/status) y MEGA (aethernet/mega/status)
# - aethernet/sensor/#        -> telemetría genérica (HU-03, RNF-2.1 EMA) — futuro KY-037/HC-SR04
#   Como topics en un broker: aethernet/ es namespace (como /api/ en REST), # es wildcard (como /* en Express)

# --------------------------------------------------------------------------
# Regla por defecto Sprint 1 — LAN cerrada, permitir todo en aethernet/# (FOSS, sin auth compleja)
# --------------------------------------------------------------------------
# Por defecto, permitir todo en LAN (Sprint 1) — allow_anonymous true + sin user/pass
# topic readwrite aethernet/# — read = subscribe, write = publish — como GRANT SELECT, INSERT en Postgres
# Equivale a `app.use(cors({origin: "*"}))` en Express pero para MQTT — LAN trust
topic readwrite aethernet/#
# todos pueden pub/sub en aethernet/* — Gateway, App, Node-RED, backend
# $SYS/# — topics sistema Mosquitto (stats broker) — como /metrics en Prometheus, para debug
topic readwrite $SYS/#
# permite suscribirse a $SYS/broker/* para monitor Mosquitto (como SELECT en pg_stat)

# Futuro prod: por user
# user gateway-esp32
# topic readwrite aethernet/rover/#
# topic readwrite aethernet/access/#
# user app-android
# topic read aethernet/rover/telemetry
# topic write aethernet/rover/command
# Como RBAC en React: cada rol (gateway, app) tiene permisos distintos por topic.
