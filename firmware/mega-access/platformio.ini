; PlatformIO configuration for MEGA Access Control
; Run with: pio run -d firmware/mega-access

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps = 
    nullkraft/Keypad@^3.1.1
    arduino-libraries/Servo@^1.2.1
    tmrh20/RF24@^1.4.1

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3