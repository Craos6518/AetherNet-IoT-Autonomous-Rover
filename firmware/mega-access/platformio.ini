; PlatformIO configuration for MEGA Access Control
; Run with: pio run -d firmware/mega-access

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; Libraries — RF-2.2/HU-01: solo Keypad + Servo + ArduinoJson (FOSS, sin RF en MEGA)
; RF24 se mueve a gateway-esp32/rover-uno únicamente
lib_deps = 
    nullkraft/Keypad@^3.1.1
    arduino-libraries/Servo@^1.2.1
    bblanchon/ArduinoJson@^6.21.3

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3