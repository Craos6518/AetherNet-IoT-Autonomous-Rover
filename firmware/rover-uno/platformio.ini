; PlatformIO configuration for Rover UNO
; Run with: pio run -d firmware/rover-uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps = 
    tmrh20/RF24@^1.4.1
    lcdibrary/NewPing@^1.9.1

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3