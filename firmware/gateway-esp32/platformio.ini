; PlatformIO configuration for Gateway ESP32
; Run with: pio run -d firmware/gateway-esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Libraries — ArduinoJson pin 6.21.3 alineado con mega-access / ci.yml:97
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@6.21.3
    tmrh20/RF24@^1.4.1

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Partition scheme (default 4MB with spiffs)
board_build.partitions = default_4MB.csv

; Custom upload port (adjust as needed)
; upload_port = /dev/ttyUSB0